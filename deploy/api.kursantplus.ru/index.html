<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Курсант+ | Автошкола категории B</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: #14213f;
        background:
          radial-gradient(circle at top right, rgba(227, 194, 99, 0.22), transparent 28%),
          radial-gradient(circle at bottom left, rgba(179, 32, 37, 0.08), transparent 25%),
          linear-gradient(180deg, #fbfaf6, #f2efe8);
      }

      .status {
        width: min(100%, 44rem);
        padding: 2.4rem 2.4rem 2.2rem;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 20px 50px rgba(20, 33, 63, 0.08);
      }

      .status__eyebrow {
        margin: 0 0 0.85rem;
        color: #b32025;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 0.95rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 1.75rem + 1vw, 2.8rem);
        line-height: 1.08;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: rgba(20, 33, 63, 0.82);
      }

      .status__cta {
        margin-top: 1.6rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.2rem;
        padding: 0.85rem 1.35rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #d8a73c, #f0cb67);
        color: #14213f;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 12px 28px rgba(216, 167, 60, 0.28);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .status__cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 32px rgba(216, 167, 60, 0.34);
      }

      .status__meta {
        margin-top: 1rem;
        font-size: 0.96rem;
        color: rgba(20, 33, 63, 0.62);
      }

      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }

        .status {
          padding: 1.65rem 1.25rem 1.5rem;
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="status">
      <p class="status__eyebrow">Автошкола категории B</p>
      <h1>Курсант+ в Москве</h1>
      <p>
        Подготовка водителей категории B на МКПП и АКПП, понятные тарифы,
        сопровождение до экзамена и спокойный путь к уверенной практике.
      </p>
      <a class="status__cta" href="https://kursantplus.ru/">Перейти на основной сайт</a>
      <p class="status__meta">Официальный сайт автошколы Курсант+</p>
    </main>
  </body>
</html>
